# Nginx http{} context. Single origin example; apply and tune in staging first.
# Keep these ceilings wider than application quotas; all replicas must share this edge.
limit_req_zone $binary_remote_addr zone=zqzg_public:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=zqzg_media:10m rate=600r/m;
server {
    listen 443 ssl;
    server_name zqzhg.com;
    # Use your existing TLS certificate configuration here.
    # App env: TRUSTED_PROXIES=127.0.0.1/32,::1/128
    # App env: PUBLIC_BASE_URL=https://zqzhg.com
    error_page 429 = @zqzg_rate_limited;
    location @zqzg_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"public_rate_limited"}}';
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(?:api/v1/public/(?:vendors|products|showrooms|resources|home)|api/v1/favorites$|v/|vendors/|products/|browse) {
        limit_req zone=zqzg_public burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/v1/media/ {
        limit_req zone=zqzg_media burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Range and If-Range pass through; disable buffering for streamed media.
        proxy_buffering off;
    }
}
# Behind a CDN, first configure real_ip only for verified CDN CIDRs.
# Never use set_real_ip_from 0.0.0.0/0. Restrict direct origin access with a firewall.

# Edge zones aggregate request rate, not per-hour distinct content across replicas.
