# Temporary certificate bootstrap; keep the pre-existing fallback application
# unchanged until the reviewed exhibition candidate is ready for cutover.
server {
    listen 80;
    listen [::]:80;
    server_name zqzhg.com www.zqzhg.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/zqzt-acme;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
