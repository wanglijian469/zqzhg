# Examples, not a complete substitute for the existing TLS/security configuration.
# Backend HTTP_ADDR should bind loopback; only trust the configured proxy IP.
# Do not alias /media to a disk directory: authorization and review gates are in Go.
upstream zqzg_backend { server 127.0.0.1:8090; keepalive 32; }
server {
    listen 443 ssl;
    server_name zqzhg.com;
    ssl_certificate /etc/letsencrypt/live/zqzhg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zqzhg.com/privkey.pem;
    client_max_body_size 1025m; # Align with server hard limits; app still validates each type.
    location / {
        proxy_pass http://zqzg_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # Range, If-Range and HEAD pass through unchanged.
    }
}
server {
    listen 8089; # Use a separate backend port if the old public IP must keep port 8089.
    server_name 39.97.250.244;
    client_max_body_size 1025m;
    location ^~ /api/v1/ { proxy_pass http://zqzg_backend; include /etc/nginx/snippets/zqzg-proxy-headers.conf; }
    location ^~ /media/ { proxy_pass http://zqzg_backend; include /etc/nginx/snippets/zqzg-proxy-headers.conf; }
    location / {
        if ($request_method = GET) { return 301 https://zqzhg.com$request_uri; }
        if ($request_method = HEAD) { return 301 https://zqzhg.com$request_uri; }
        return 405;
    }
}
