server {
    listen 80;
    server_name zqzhg.com www.zqzhg.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/zqzt-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://zqzhg.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name zqzhg.com;
    ssl_certificate /etc/letsencrypt/live/zqzhg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zqzhg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /acceptance/ {
        alias /opt/zqzt/shared/acceptance/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment;
    }
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
# Enable this block only after the certificate covers both domain names.
server {
    listen 443 ssl;
    server_name www.zqzhg.com;
    ssl_certificate /etc/letsencrypt/live/zqzhg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zqzhg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://zqzhg.com$request_uri;
}
